# 将此项合并到 mcp-gateway/config/gateway.yaml 已有的 office_common_tools，不要重复添加后端。
# 网关凭据文件增加 OFFICE_API_KEY，其值与本服务 Authentication:ApiKey 一致。
# 首次加载需要办公服务在线，之后网关可以使用已有的 OpenAPI 缓存。
services:
  - name: office_common_tools
    title: 办公服务 · 考勤
    instructions: 所有完整时间统一为 yyyy-MM-ddTHH:mm:ss+08:00，full明细的已知时间同样可读；不返回time_zone，纯日期保持yyyy-MM-dd，时长仍为数字。local_execution返回executed_at等可读字段。 此连接提供员工列表、动态员工考勤查询、加班统计、主动打卡和任务状态查询。attendance_query 返回全部日期考勤，attendance_overtime 仅在 days 返回按配置筛选的加班日及全部打卡，并提供 summary；complete=false 时查看 errors，不能把查询失败当成没有加班。可先用 employee_list 获取员工ID；姓名重名时根据候选ID选择，勿猜选。主动打卡仍使用配置的固定员工。仅在用户明确要求打卡时调用 attendance_clock_in；未完成时用 attendance_clock_in_status 查询同一任务，只有 attendance_confirmed=true 才确认有记录。attendance_automation_set 用于明确开关被动自动打卡；开启不补打，关闭不影响主动打卡。手机断网沿用旧开关，只有 sync_state=applied 才可说明当前 desired_enabled 已在手机生效；pending 用 attendance_automation_status 查询，request_superseded=true 表示原请求已被后续设置覆盖。
    type: openapi
    base_url: http://127.0.0.1:18101
    spec_url: http://127.0.0.1:18101/openapi/v1.json
    headers:
      X-Api-Key: "${OFFICE_API_KEY}"
    timeout_seconds: 150
    methods: [GET, POST]
    include_operations: [attendance_query, attendance_overtime, employee_list, attendance_clock_in, attendance_clock_in_status, attendance_automation_set, attendance_automation_status]
