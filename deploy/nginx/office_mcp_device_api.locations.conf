# 在现有 HTTPS server {} 中 include 此文件，不作为独立 server 或 http 配置加载。
# 手机 base_url=https://mcp.example.com/office_mcp_device_api。
# 原 location / 的 mcp-gateway 转发保留；这里仅代理明确允许的设备接口。

location ~ "^/office_mcp_device_api/(?<office_device_post_path>devices/[A-Za-z0-9_-]{1,64}/(?:commands/lease|commands/[a-f0-9]{32}/report|probes/[a-f0-9]{32}/ack|attendance/executions|attendance/automation/sync))$" {
    # 领取、回执、事实和策略同步只接受 POST，不能通过方法替换访问其他业务。
    if ($request_method != POST) { return 405; }

    proxy_pass http://127.0.0.1:18101/api/$office_device_post_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # 透传手机独立凭据；不注入网关／办公身份，不代替后端设备与任务归属校验。
    proxy_set_header X-Device-Id $http_x_device_id;
    proxy_set_header X-Device-Key $http_x_device_key;
    proxy_set_header Authorization "";
    proxy_set_header X-Api-Key "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 40s;
    proxy_buffering off;
    proxy_cache off;
    # 设备操作不由代理重新投递；手机按原协议只重传同一任务的回执。
    proxy_next_upstream off;
}

location ~ "^/office_mcp_device_api/(?<office_device_get_path>devices/[A-Za-z0-9_-]{1,64}/attendance/tasks/[a-f0-9]{32})$" {
    if ($request_method != GET) { return 405; }

    proxy_pass http://127.0.0.1:18101/api/$office_device_get_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Device-Id $http_x_device_id;
    proxy_set_header X-Device-Key $http_x_device_key;
    proxy_set_header Authorization "";
    proxy_set_header X-Api-Key "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 40s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
}

# 根地址和白名单以外的路径直接拒绝，不能落入原 MCP 路由或办公接口。
location = /office_mcp_device_api { return 404; }
location /office_mcp_device_api/ { return 404; }
